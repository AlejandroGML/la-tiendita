# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Builds backend and frontend from their production Dockerfiles instead of
# pulling dev images. Adds an nginx reverse proxy on port 80. Uses a named
# uploads volume for persistent file storage.

services:
  # ── Backend: build from Dockerfile, add uploads volume ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tiendita_prod
      EMAIL_MODE: log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend: build Angular app → serve with nginx ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy (only exposed port) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL: add prod database env variable ──
  db:
    environment:
      POSTGRES_DB: tiendita_prod

volumes:
  uploads:
