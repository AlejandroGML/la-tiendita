<!DOCTYPE html>
<html lang="{{ lang | default('es') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}La Tiendita{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: #059669;
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .body {
            padding: 24px;
            color: #333;
            line-height: 1.6;
        }
        .footer {
            background: #fafafa;
            padding: 16px 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .button {
            display: inline-block;
            background: #059669;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block header %}La Tiendita{% endblock %}</h1>
        </div>
        <div class="body">
{% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; {{ year }} La Tiendita. {{ messages.footer.automated | default('This is an automated message.') }}</p>
        </div>
    </div>
</body>
</html>
