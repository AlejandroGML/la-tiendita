server {
    listen 80;

    # Route to frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route API calls to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve uploaded images directly from disk — no proxy to Python.
    # The uploads named volume is mounted at /srv/uploads in the nginx container
    # (see docker-compose.prod.yml). Cache headers enable aggressive browser +
    # CDN caching for all product images.
    location /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable, must-revalidate";
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;

        # Fall back to backend if the file is missing
        try_files $uri @backend_uploads;
    }

    location @backend_uploads {
        internal;
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Health check endpoint (proxied to backend)
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
