# La Tiendita — Fly.io configuration (single container)
# Deploy: fly launch --copy-config --no-deploy && fly secrets set ... && fly deploy

app = "la-tiendita"
primary_region = "arn"  # Stockholm — closest to the Swedish target market

[build]
  dockerfile = "Dockerfile"

[env]
  EMAIL_MODE = "log"
  FRONTEND_DIST_DIR = "/app/frontend-dist"
  CACHE_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # never sleep — portfolio demo must respond instantly
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/v1/health/ready"

  [[http_service.ports]]
    port = 80
    handlers = ["http"]
  [[http_service.ports]]
    port = 443
    handlers = ["tls", "http"]

# Secrets (set via `fly secrets set`, NEVER in this file):
#   SECRET_KEY, DATABASE_URL, REDIS_URL, RESEND_API_KEY, EMAIL_FROM,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_OAUTH_REDIRECT_URI,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CORS_ORIGINS
