# La Tiendita — Fly.io configuration (single container, single process)
# redis-server runs inside the same container via entrypoint.sh
# Deploy: fly deploy  (after: fly secrets set ...)

app = "la-tiendita"
primary_region = "arn"  # Stockholm — closest to the Swedish target market

[build]
  dockerfile = "Dockerfile"

[env]
  EMAIL_MODE = "log"
  FRONTEND_DIST_DIR = "/app/frontend-dist"
  REDIS_URL = "redis://localhost:6379/0"
  CACHE_ENABLED = "true"

[[services]]
  internal_port = 8000
  processes = ["web"]
  force_https = true
  auto_stop_machines = false  # never sleep — portfolio demo must respond instantly
  auto_start_machines = true
  min_machines_running = 1

  [[services.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/v1/health/ready"

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# Secrets (set via `fly secrets set`, NEVER in this file):
#   SECRET_KEY, RESEND_API_KEY, EMAIL_FROM, GOOGLE_CLIENT_ID,
#   GOOGLE_CLIENT_SECRET, GOOGLE_OAUTH_REDIRECT_URI,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CORS_ORIGINS
