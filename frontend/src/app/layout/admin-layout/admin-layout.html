<div class="ad-shell">

  <!-- ════════════════════════ -->
  <!-- Sidebar                  -->
  <!-- ════════════════════════ -->
  <aside class="ad-sidebar">

    <!-- Sidebar Header -->
    <div class="ad-brand">
      <div class="flex items-center gap-3">
        <div class="ad-brand-mark">LT</div>
        <div>
          <span class="ad-brand-name">{{ 'header.title' | translate }}</span>
          <span class="ad-brand-sub">Panel Admin</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="ad-nav" aria-label="Panel de administración">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active-nav-item"
         [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
         [attr.data-testid]="'nav-' + item.icon.replace('pi pi-', '')"
         class="ad-nav-link">
        <i [class]="item.icon"></i>
        <span>{{ item.label | translate }}</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="ad-side-foot">
      <a routerLink="/" class="ad-back-link">
        <i class="pi pi-arrow-left"></i>
        {{ 'admin.backToStore' | translate }}
      </a>
    </div>
  </aside>

  <!-- ════════════════════════ -->
  <!-- Main content             -->
  <!-- ════════════════════════ -->
  <div class="ad-main">

    <!-- Top Toolbar -->
    <header class="ad-toolbar">
      <div class="flex items-center gap-3">
        <span class="crumb">/ {{ currentRoute }}</span>
      </div>
      <div class="flex items-center gap-4" data-testid="user-info">
        <div class="flex items-center gap-2.5">
          <div class="ad-user-avatar">
            {{ userName.charAt(0)?.toUpperCase() || 'A' }}
          </div>
          <div class="hidden sm:flex flex-col text-sm leading-tight">
            <span class="ad-user-name">{{ userName }}</span>
            <span class="ad-user-email">{{ userEmail }}</span>
          </div>
        </div>
        <button pButton
                icon="pi pi-sign-out"
                [rounded]="true"
                [text]="true"
                severity="secondary"
                (onClick)="logout()"
                data-testid="btn-logout"
                class="ad-logout"></button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="ad-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
