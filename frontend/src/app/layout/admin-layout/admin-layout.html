<div class="flex h-screen">
  <aside class="w-60 bg-slate-50 border-r flex flex-col" data-testid="admin-sidenav">
    <div class="sidenav-header border-b border-slate-200">
      <h2 class="text-lg font-bold px-4 py-3">{{ 'header.title' | translate }}</h2>
      <span class="text-xs text-gray-500 px-4 pb-3 block">{{ 'admin.panel' | translate }}</span>
    </div>

    <nav class="flex-1 pt-2">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
        [attr.data-testid]="'nav-' + item.icon"
        class="flex items-center gap-3 px-4 py-3 text-sm hover:bg-black/5 border-l-3 border-transparent"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label | translate }}</span>
      </a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <p-toolbar styleClass="sticky top-0 z-10">
      <ng-template pTemplate="start">
        <span class="font-medium">{{ 'admin.panel' | translate }}</span>
      </ng-template>
      <ng-template pTemplate="end">
        <div class="flex items-center gap-3" data-testid="user-info">
          <i class="pi pi-user"></i>
          <div class="hidden sm:flex flex-col text-sm leading-tight">
            <span class="font-medium">{{ userName }}</span>
            <span class="text-xs opacity-75">{{ userEmail }}</span>
          </div>
          <p-button
            icon="pi pi-sign-out"
            [rounded]="true"
            [text]="true"
            [attr.aria-label]="'admin.logout' | translate"
            (onClick)="logout()"
            data-testid="btn-logout"
          ></p-button>
        </div>
      </ng-template>
    </p-toolbar>

    <div class="flex-1 overflow-y-auto p-6 bg-slate-100">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
