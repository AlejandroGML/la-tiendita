<header class="td-header">
  <div class="container">
    <div class="td-header-bar">

      <!-- Logo -->
      <a routerLink="/" class="td-logo">
        <span class="td-logo-mark">LT</span>
        <span class="td-logo-name">{{ 'header.title' | translate }}</span>
      </a>

      <!-- Search — Desktop -->
      <div class="td-search">
        <app-search-bar (search)="onSearch($event)"></app-search-bar>
      </div>

      <!-- Actions -->
      <nav class="td-header-actions" aria-label="Navegación principal">
        <app-wishlist-badge class="hide-m"></app-wishlist-badge>
        <app-cart-badge></app-cart-badge>
        <app-user-menu class="hide-m"></app-user-menu>
        <app-language-switcher class="hide-m"></app-language-switcher>
        <app-currency-switcher class="hide-m"></app-currency-switcher>
        <app-theme-toggle></app-theme-toggle>

        <!-- Hamburger — Mobile -->
        <button type="button"
                class="td-icon-btn td-hamburger"
                (click)="mobileOpen = !mobileOpen"
                [attr.aria-label]="'header.menu' | translate">
          <span [innerHTML]="(mobileOpen ? 'x' : 'menu') | svgIcon"></span>
        </button>
      </nav>
    </div>

    <!-- Category nav + mega menu -->
    <app-navigation></app-navigation>
  </div>

  <!-- Mobile Menu (slide-down) -->
  <app-mobile-menu [isOpen]="mobileOpen"
                   [categories]="categories"
                   (closed)="onMobileClosed()"></app-mobile-menu>
</header>
