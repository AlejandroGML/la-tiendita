<div data-mobile-menu
     *ngIf="isOpen"
     class="td-mobile-menu mobile-slide">

  <!-- Mobile Search inline -->
  <div class="td-search td-mobile-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input
      pInputText
      type="text"
      [placeholder]="'header.search' | translate"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearch($event)"
    />
  </div>

  <!-- Categorías -->
  <p class="td-mobile-section-label">{{ 'header.categorias' | translate }}</p>
  <div class="flex flex-wrap gap-1.5 mb-2 px-1">
    <a *ngFor="let cat of categories"
       [routerLink]="['/productos']"
       [queryParams]="{category_id: cat.id}"
       class="td-mobile-chip"
       (click)="closed.emit()">
      <i [ngClass]="'pi ' + getCategoryIcon(cat.slug)"></i>{{ cat.name || cat.slug }}
    </a>
  </div>

  <div class="td-dropdown-sep" style="margin: 0.4rem 0.4rem 0.2rem"></div>

  <!-- Nav links -->
  <a routerLink="/productos" class="td-mobile-link" (click)="closed.emit()">
    <span [innerHTML]="'tag' | svgIcon:'w-4 h-4'"></span>
    {{ 'nav.ofertas' | translate }}
  </a>
  <a routerLink="/productos" [queryParams]="{sort: 'newest'}" class="td-mobile-link" (click)="closed.emit()">
    <span [innerHTML]="'sparkles' | svgIcon:'w-4 h-4'"></span>
    {{ 'nav.nuevo' | translate }}
  </a>
  <a routerLink="/productos" [queryParams]="{sort: 'popular'}" class="td-mobile-link" (click)="closed.emit()">
    <span [innerHTML]="'trendingUp' | svgIcon:'w-4 h-4'"></span>
    {{ 'nav.popular' | translate }}
  </a>

  <div class="td-dropdown-sep" style="margin: 0.4rem 0.4rem 0.2rem"></div>

  <!-- Ajustes: tema / idioma / moneda -->
  <p class="td-mobile-section-label">{{ 'header.tema' | translate }}</p>
  <div class="td-mobile-chips">
    <button type="button"
            class="td-mobile-chip"
            [class.is-on]="!themeService.isDark()"
            [attr.aria-pressed]="!themeService.isDark()"
            (click)="setTheme('light')">
      {{ 'header.claro' | translate }}
    </button>
    <button type="button"
            class="td-mobile-chip"
            [class.is-on]="themeService.isDark()"
            [attr.aria-pressed]="themeService.isDark()"
            (click)="setTheme('dark')">
      {{ 'header.oscuro' | translate }}
    </button>
  </div>

  <p class="td-mobile-section-label">{{ 'header.idioma' | translate }}</p>
  <div class="td-mobile-chips">
    <button *ngFor="let lang of LANGS"
            type="button"
            class="td-mobile-chip"
            [class.is-on]="lang === currentLang"
            [attr.aria-pressed]="lang === currentLang"
            (click)="setLang(lang)">
      {{ langName(lang) }}
    </button>
  </div>

  <p class="td-mobile-section-label">{{ 'header.moneda' | translate }}</p>
  <div class="td-mobile-chips">
    <button *ngFor="let c of currencyService.availableCurrencies"
            type="button"
            class="td-mobile-chip"
            [class.is-on]="c.code === currencyService.currency()"
            [attr.aria-pressed]="c.code === currencyService.currency()"
            (click)="setCurrency(c.code)">
      {{ c.code }}
    </button>
  </div>
</div>
