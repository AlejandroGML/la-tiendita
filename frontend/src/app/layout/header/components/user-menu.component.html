<!-- Guest state -->
<a *ngIf="!isLoggedIn" routerLink="/login"
   class="p-2 text-gray-500 dark:text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors rounded-lg hover:bg-emerald-50 dark:hover:bg-gray-800 active:bg-emerald-100 dark:active:bg-gray-700"
   [attr.aria-label]="'header.iniciarSesionAria' | translate"
   [innerHTML]="'user' | svgIcon">
</a>

<!-- Authenticated state -->
<div *ngIf="isLoggedIn"
     data-user-menu
     class="relative"
     (mouseenter)="onUserMenuEnter()"
     (mouseleave)="onUserMenuLeave()">

  <button type="button"
          (click)="userMenuOpen = !userMenuOpen"
          class="flex items-center gap-1.5 px-2 py-1.5 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors rounded-lg hover:bg-emerald-50 dark:hover:bg-gray-800">
    <span [innerHTML]="'user' | svgIcon:'w-4 h-4'"></span>
    <span class="hidden sm:inline max-w-[120px] truncate">{{ userName }}</span>
    <span [innerHTML]="'chevronDown' | svgIcon:'w-3 h-3'"
          class="transition-transform duration-200"
          [class.rotate-180]="userMenuOpen"></span>
  </button>

  <!-- User dropdown -->
  <div *ngIf="userMenuOpen"
       (mouseenter)="clearUserMenuTimeout(); userMenuOpen = true"
       (mouseleave)="userMenuOpen = false"
       class="absolute top-full right-0 mt-2 w-48 bg-white dark:bg-gray-900 rounded-xl shadow-lg dark:shadow-gray-900/80 border border-gray-100 dark:border-gray-700 py-1 z-50 overflow-hidden">

    <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-800">
      <p class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate">{{ userName }}</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 truncate">{{ currentUser?.email }}</p>
    </div>

    <a routerLink="/perfil"
       (click)="userMenuOpen = false"
       class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-emerald-50 dark:hover:bg-gray-800 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
      <span [innerHTML]="'user' | svgIcon:'w-4 h-4'"></span>
      {{ 'header.verPerfil' | translate }}
    </a>

    <!-- Admin Dashboard link (admin only) -->
    <a *ngIf="isAdmin"
       routerLink="/admin"
       (click)="userMenuOpen = false"
       class="flex items-center gap-3 px-4 py-2.5 text-sm text-sky-700 dark:text-sky-400 hover:bg-sky-50 dark:hover:bg-sky-900/20 hover:text-sky-600 dark:hover:text-sky-300 transition-colors">
      <span class="w-4 h-4 flex items-center justify-center"><i class="pi pi-shield text-sm"></i></span>
      Panel Admin
    </a>

    <button type="button"
            (click)="logout()"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 dark:hover:text-red-400 transition-colors">
      <span [innerHTML]="'logOut' | svgIcon:'w-4 h-4'"></span>
      {{ 'header.cerrarSesion' | translate }}
    </button>
  </div>
</div>
