<div class="relative">
  <button type="button"
          (click)="currencyOpen = !currencyOpen"
          class="relative px-2 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors rounded-lg hover:bg-emerald-50 dark:hover:bg-gray-800"
          [attr.aria-label]="'header.cambiarMoneda' | translate">
    <span>{{ currencyService.symbol }}</span>
  </button>

  <div *ngIf="currencyOpen"
       class="absolute top-full right-0 mt-2 w-40 bg-white dark:bg-gray-900 rounded-xl shadow-lg dark:shadow-gray-900/80 border border-gray-100 dark:border-gray-700 py-1 z-50 overflow-hidden">
    <button *ngFor="let c of currencyService.availableCurrencies"
            type="button"
            (click)="setCurrency(c.code)"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left transition-colors"
            [class.text-emerald-600]="c.code === currencyService.currency()"
            [class.font-semibold]="c.code === currencyService.currency()"
            [class.text-gray-700]="c.code !== currencyService.currency()"
            [class.dark:text-emerald-400]="c.code === currencyService.currency()"
            [class.dark:text-gray-300]="c.code !== currencyService.currency()"
            [class.hover:bg-emerald-50]="c.code !== currencyService.currency()"
            [class.dark:hover:bg-gray-800]="c.code !== currencyService.currency()">
      <span class="text-base w-6 text-center">{{ c.flag }}</span>
      <span class="flex-1">{{ c.code }}</span>
      <span *ngIf="c.code === currencyService.currency()" class="text-emerald-500 dark:text-emerald-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>
  </div>
</div>
