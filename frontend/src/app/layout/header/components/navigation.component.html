<nav aria-label="Categorías" class="td-nav">
  <div class="container">
    <div class="td-nav-row">

      <app-mega-menu></app-mega-menu>

      <!-- Quick links -->
      <a routerLink="/productos" [queryParams]="{oferta: true}"
         class="td-nav-link">
        <span [innerHTML]="'tag' | svgIcon:'w-4 h-4'"></span>
        {{ 'nav.ofertas' | translate }}
      </a>
      <a routerLink="/productos" [queryParams]="{sort: 'newest'}"
         class="td-nav-link">
        <span [innerHTML]="'sparkles' | svgIcon:'w-4 h-4'"></span>
        {{ 'nav.nuevo' | translate }}
      </a>
      <a routerLink="/productos" [queryParams]="{sort: 'popular'}"
         class="td-nav-link">
        <span [innerHTML]="'trendingUp' | svgIcon:'w-4 h-4'"></span>
        {{ 'nav.popular' | translate }}
      </a>

      <!-- Gender tabs (inline right) -->
      <div class="td-gender-tabs" role="tablist">
        <button type="button"
                *ngFor="let tab of GENDER_TABS"
                (click)="navigateByGender(tab.value)"
                class="td-gender-tab"
                [class.is-on]="isGenderActive(tab.value)">
          {{ tab.label | translate }}
        </button>
      </div>
    </div>
  </div>
</nav>
