<button type="button"
        (click)="toggle()"
        class="p-2 text-gray-500 dark:text-gray-400 hover:text-amber-500 dark:hover:text-amber-400 transition-colors rounded-lg hover:bg-amber-50 dark:hover:bg-gray-800 active:bg-amber-100 dark:active:bg-gray-700"
        [attr.aria-label]="(isDark ? 'header.modoClaro' : 'header.modoOscuro') | translate"
        [innerHTML]="svg(themeIcon)">
</button>
