<div class="relative"
     (mouseenter)="langOpen = true"
     (mouseleave)="onLangLeave()">
  <button type="button"
          (click)="langOpen = !langOpen"
          class="relative p-2 text-gray-500 dark:text-gray-400 hover:text-sky-500 dark:hover:text-sky-400 transition-colors rounded-lg hover:bg-sky-50 dark:hover:bg-gray-800 active:bg-sky-100 dark:active:bg-gray-700"
          [attr.aria-label]="'header.cambiarIdioma' | translate">
    <span [innerHTML]="'globe' | svgIcon"></span>
    <span class="absolute -bottom-0.5 -right-0.5 text-[8px] font-bold text-sky-600 dark:text-sky-400 bg-white dark:bg-gray-800 rounded-sm px-0.5 leading-tight shadow-sm border border-sky-200 dark:border-sky-700">
      {{ currentLang | uppercase }}
    </span>
  </button>

  <div *ngIf="langOpen"
       (mouseenter)="clearLangTimeout(); langOpen = true"
       (mouseleave)="langOpen = false"
       class="absolute top-full right-0 mt-2 w-40 bg-white dark:bg-gray-900 rounded-xl shadow-lg dark:shadow-gray-900/80 border border-gray-100 dark:border-gray-700 py-1 z-50 overflow-hidden">
    <button *ngFor="let lang of LANG_CYCLE"
            type="button"
            (click)="setLang(lang)"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left transition-colors"
            [class.text-sky-600]="lang === currentLang"
            [class.font-semibold]="lang === currentLang"
            [class.text-gray-700]="lang !== currentLang"
            [class.dark:text-sky-400]="lang === currentLang"
            [class.dark:text-gray-300]="lang !== currentLang"
            [class.hover:bg-sky-50]="lang !== currentLang"
            [class.dark:hover:bg-gray-800]="lang !== currentLang">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold"
            [class.bg-sky-100]="lang === currentLang"
            [class.text-sky-600]="lang === currentLang"
            [class.bg-gray-100]="lang !== currentLang"
            [class.text-gray-500]="lang !== currentLang"
            [class.dark:bg-sky-900/40]="lang === currentLang"
            [class.dark:bg-gray-700]="lang !== currentLang"
            [class.dark:text-sky-400]="lang === currentLang"
            [class.dark:text-gray-400]="lang !== currentLang">
        {{ lang | uppercase }}
      </span>
      <span>{{ LANG_NAMES[lang] }}</span>
      <span *ngIf="lang === currentLang" class="ml-auto text-sky-500 dark:text-sky-400" [innerHTML]="'check' | svgIcon:'w-3.5 h-3.5'"></span>
    </button>
  </div>
</div>
