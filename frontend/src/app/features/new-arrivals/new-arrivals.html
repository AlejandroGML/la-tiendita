<div class="new-arrivals-page min-h-screen max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-8">
    {{ 'nav.newArrivals' | translate }}
  </h1>

  <!-- Loading -->
  <div *ngIf="loading()" class="flex justify-center py-24">
    <p-progressSpinner [style]="{width: '64px', height: '64px'}"></p-progressSpinner>
  </div>

  <!-- Error -->
  <div *ngIf="error()" class="text-center py-24">
    <p class="text-red-600 text-lg">{{ error() | translate }}</p>
  </div>

  <!-- Product Grid -->
  <div
    *ngIf="!loading() && !error()"
    class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6"
  >
    <app-product-card
      *ngFor="let product of products()"
      [product]="product"
    ></app-product-card>
  </div>

  <!-- Empty -->
  <div
    *ngIf="!loading() && !error() && products().length === 0"
    class="text-center py-24 text-gray-500 dark:text-gray-400"
  >
    {{ 'catalog.noProducts' | translate }}
  </div>
</div>
