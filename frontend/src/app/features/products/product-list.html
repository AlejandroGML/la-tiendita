<div class="product-list-page min-h-screen">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">{{ 'catalog.title' | translate }}</h1>
  </div>

  <div class="flex flex-col lg:flex-row gap-6">
    <!-- Sidebar Filters -->
    <aside class="filters-sidebar w-full lg:w-64 shrink-0">
      <div class="bg-white rounded-lg shadow p-4 sticky top-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">{{ 'catalog.filters' | translate }}</h2>
          <button
            *ngIf="hasActiveFilters()"
            class="text-sm text-blue-600 hover:text-blue-800"
            (click)="clearFilters()"
          >
            {{ 'catalog.clear' | translate }}
          </button>
        </div>

        <!-- Category -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'catalog.category' | translate }}
          </label>
          <p-select
            class="w-full"
            [options]="categoryDropdownOptions()"
            [ngModel]="filters().category_id"
            (onChange)="onFilterChange('category_id', $event.value)"
            [placeholder]="'catalog.allCategories' | translate"
          ></p-select>
        </div>

        <!-- Condition -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'product.condition' | translate }}
          </label>
          <p-select
            class="w-full"
            [options]="conditionDropdownOptions()"
            [ngModel]="filters().condition"
            (onChange)="onFilterChange('condition', $event.value)"
            [placeholder]="'catalog.allConditions' | translate"
          ></p-select>
        </div>

        <!-- Size -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'product.size' | translate }}
          </label>
          <p-select
            class="w-full"
            [options]="sizeDropdownOptions()"
            [ngModel]="filters().size"
            (onChange)="onFilterChange('size', $event.value)"
            [placeholder]="'catalog.allSizes' | translate"
          ></p-select>
        </div>

        <!-- Price Range -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'catalog.priceRange' | translate }}
          </label>
          <div class="flex gap-2">
            <p-inputNumber
              class="w-full"
              mode="currency"
              currency="CLP"
              locale="es-CL"
              [min]="0"
              [allowEmpty]="true"
              [ngModel]="filters().min_price"
              (ngModelChange)="onFilterChange('min_price', $event)"
              [placeholder]="'catalog.minPrice' | translate"
            ></p-inputNumber>
            <p-inputNumber
              class="w-full"
              mode="currency"
              currency="CLP"
              locale="es-CL"
              [min]="0"
              [allowEmpty]="true"
              [ngModel]="filters().max_price"
              (ngModelChange)="onFilterChange('max_price', $event)"
              [placeholder]="'catalog.maxPrice' | translate"
            ></p-inputNumber>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 min-w-0">
      <!-- Search -->
      <div class="mb-4">
        <app-search-bar (search)="onSearch($event)"></app-search-bar>
      </div>

      <!-- Loading state -->
      <div *ngIf="loading()" class="flex justify-center py-16">
        <p-progressSpinner
          strokeWidth="4"
          [style]="{ width: '48px', height: '48px' }"
        ></p-progressSpinner>
      </div>

      <!-- Error state -->
      <div *ngIf="error()" class="text-center py-16">
        <p class="text-red-600 text-lg">{{ error() | translate }}</p>
        <button
          class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          (click)="loadProducts()"
        >
          {{ 'catalog.retry' | translate }}
        </button>
      </div>

      <!-- Product Grid -->
      <div
        *ngIf="!loading() && !error()"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      >
        <a
          *ngFor="let product of products()"
          [routerLink]="['/productos', product.slug]"
          class="block"
        >
          <app-product-card [product]="product"></app-product-card>
        </a>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="!loading() && !error() && products().length === 0"
        class="text-center py-16"
      >
        <p class="text-gray-500 text-lg">{{ 'catalog.noResults' | translate }}</p>
      </div>

      <!-- Pagination -->
      <div *ngIf="total() > 0" class="mt-8">
        <app-pagination
          [page]="page()"
          [perPage]="perPage()"
          [total]="total()"
          (pageChange)="onPageChange($event)"
          (perPageChange)="onPerPageChange($event)"
        ></app-pagination>
      </div>
    </div>
  </div>
</div>
