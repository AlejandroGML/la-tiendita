<div class="product-list-page">
  <div class="container section" style="padding-top: 2rem">
    <!-- Breadcrumb -->
    <nav class="td-breadcrumb" aria-label="Miga de pan">
      <a routerLink="/">{{ 'nav.home' | translate }}</a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span class="here">{{ 'catalog.title' | translate }}</span>
    </nav>

    <!-- Toolbar -->
    <div class="td-toolbar">
      <div>
        <h1 class="display">{{ 'catalog.title' | translate }}</h1>
        <p *ngIf="!loading() && !error()" class="count">{{ 'catalog.resultsCount' | translate:{ total: total() } }}</p>
      </div>
      <label class="td-sort">
        <span>{{ 'catalog.sort' | translate }}</span>
        <select class="td-select" [attr.aria-label]="'catalog.sort' | translate"
                [ngModel]="filters().sort"
                (ngModelChange)="onFilterChange('sort', $event)">
          <option *ngFor="let opt of sortOptions()" [ngValue]="opt.value">{{ opt.label }}</option>
        </select>
      </label>
    </div>

    <!-- Mobile filter toggle -->
    <button class="td-filter-toggle" (click)="showFilters = !showFilters">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54Z"/></svg>
      {{ 'catalog.filters' | translate }}
    </button>

    <div class="td-layout">
      <!-- Mobile overlay backdrop -->
      <div [class.hidden]="!showFilters" class="fixed inset-0 z-20 bg-black/40 lg:hidden" (click)="showFilters = false"></div>

      <!-- Sidebar -->
      <aside class="td-filters"
             [class.open]="showFilters"
             [attr.aria-label]="'catalog.filters' | translate">
        <div class="td-filters-inner">
          <app-product-filter-sidebar
            [filters]="filters()"
            [categories]="categories()"
            (filterChange)="onFilterChange($event.key, $event.value)"
            (clearAll)="clearFilters()"
          />
        </div>
      </aside>

      <!-- Results -->
      <div class="td-catalog-results">
        <app-product-grid
          [products]="products()"
          [loading]="loading()"
          [error]="error()"
          (retry)="loadProducts()"
        />

        <!-- Pagination -->
        <div *ngIf="total() > 0" class="mt-8">
          <app-pagination
            [page]="page()"
            [perPage]="perPage()"
            [total]="total()"
            (pageChange)="onPageChange($event)"
            (perPageChange)="onPerPageChange($event)"
          ></app-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
