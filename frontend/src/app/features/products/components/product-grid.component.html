<!-- Loading state -->
<div *ngIf="loading" class="td-grid">
  <div *ngFor="let _ of [1,2,3,4,5,6,7,8]" class="skeleton-card" style="aspect-ratio: 3/4; height: auto"></div>
</div>

<!-- Error state -->
<div *ngIf="error" class="td-empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
  <p>{{ error | translate }}</p>
  <button type="button" class="td-btn td-btn-secondary" (click)="onRetry()">
    {{ 'catalog.retry' | translate }}
  </button>
</div>

<!-- Product Grid -->
<div
  *ngIf="!loading && !error"
  class="td-grid"
>
  <a
    *ngFor="let product of products"
    [routerLink]="['/productos', product.slug]"
    class="block"
  >
    <app-product-card [product]="product"></app-product-card>
  </a>
</div>

<!-- Empty state -->
<div
  *ngIf="!loading && !error && products.length === 0"
  class="td-empty"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
  <p>{{ 'catalog.noResults' | translate }}</p>
</div>
