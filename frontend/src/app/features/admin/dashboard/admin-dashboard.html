<h1 class="text-2xl font-bold mb-6">{{ 'admin.dashboard' | translate }}</h1>

<p-progressSpinner
  *ngIf="loading()"
  strokeWidth="4"
  styleClass="w-10 h-10 my-12 mx-auto block"
  data-testid="dashboard-loading"
></p-progressSpinner>

<div
  *ngIf="error() && !loading()"
  class="text-center py-12"
  data-testid="dashboard-error"
>
  <i class="pi pi-exclamation-circle text-4xl text-red-400 mb-2 block"></i>
  <p class="text-gray-500">{{ 'admin.dashboardError' | translate }}</p>
  <p-button
    [outlined]="true"
    [label]="'catalog.retry' | translate"
    (onClick)="loadStats()"
    styleClass="mt-3"
    data-testid="dashboard-retry"
  ></p-button>
</div>

<div
  *ngIf="!loading() && !error() && stats()"
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
  data-testid="dashboard-stats"
>
  <p-card
    *ngFor="let card of getStatCards()"
    styleClass="stat-card"
    [attr.data-testid]="'stat-' + card.icon"
  >
    <div class="flex items-center gap-4 p-4">
      <i [class]="card.icon + ' text-3xl text-primary'"></i>
      <div>
        <p class="text-sm text-gray-500">{{ card.labelKey | translate }}</p>
        <p class="text-2xl font-bold">
          {{ card.icon.includes('dollar') ? ((card.value | currency)) : card.value }}
        </p>
      </div>
    </div>
  </p-card>
</div>
