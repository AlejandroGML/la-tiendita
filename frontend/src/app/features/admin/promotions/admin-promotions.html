<div class="admin-promotions-container max-w-6xl mx-auto p-6">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ 'promotions.title' | translate }}</h1>
    <p-button
      *ngIf="!showForm()"
      icon="pi pi-plus"
      [label]="'promotions.new' | translate"
      (onClick)="openCreateForm()"
      data-testid="btn-new-promotion"
    ></p-button>
  </header>

  <app-promotion-form
    *ngIf="showForm()"
    [promotion]="editingPromotion()"
    [saving]="saving()"
    (saved)="onFormSaved($event)"
    (cancelled)="cancelForm()"
  ></app-promotion-form>

  <app-promotion-list
    *ngIf="!showForm()"
    [promotions]="promotions()"
    [loading]="loading()"
    [error]="error()"
    (edit)="openEditForm($event)"
    (delete)="deletePromotion($event)"
    (retry)="loadPromotions()"
  ></app-promotion-list>

  <p-toast position="bottom-right"></p-toast>
</div>
