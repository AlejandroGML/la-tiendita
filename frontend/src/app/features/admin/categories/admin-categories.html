<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Categorías</h1>
  <p-button icon="pi pi-plus" label="Nueva categoría" severity="primary" (click)="openCreate()"></p-button>
</div>

<p-progressSpinner *ngIf="loading()" strokeWidth="4" styleClass="w-10 h-10 my-12 mx-auto block" data-testid="categories-loading"></p-progressSpinner>

<div *ngIf="error() && !loading()" class="text-center py-12" data-testid="categories-error">
  <i class="pi pi-exclamation-circle text-4xl text-red-400 mb-2 block"></i>
  <p class="text-gray-500 dark:text-gray-400">Error al cargar categorías</p>
  <p-button [outlined]="true" label="Reintentar" (click)="loadCategories()" styleClass="mt-3"></p-button>
</div>

<div *ngIf="!loading() && !error() && categories().length === 0" class="text-center py-12 text-gray-500 dark:text-gray-400" data-testid="no-categories">
  <i class="pi pi-tags text-4xl mb-2 block"></i>
  <p>No hay categorías</p>
</div>

<div *ngIf="!loading() && !error() && categories().length > 0" class="overflow-x-auto" data-testid="categories-table">
  <p-table [value]="categories()" styleClass="w-full">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Slug</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cat>
      <tr>
        <td class="font-mono text-sm">{{ cat.id }}</td>
        <td>{{ cat.slug }}</td>
        <td class="font-medium">{{ cat.name }}</td>
        <td>
          <div class="flex gap-1">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="primary" (click)="openEdit(cat)" pTooltip="Editar"></p-button>
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="deleteCategory(cat)" pTooltip="Eliminar"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Create / Edit modal -->
<p-dialog [(visible)]="dialogVisible" [modal]="true" [closable]="true" [draggable]="false"
          [header]="(editingCategory ? 'Editar categoría' : 'Nueva categoría')" styleClass="w-full max-w-lg">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Slug</label>
      <input pInputText [(ngModel)]="formSlug" class="w-full" placeholder="ej: camisetas" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">URL de imagen (opcional)</label>
      <input pInputText [(ngModel)]="formImageUrl" class="w-full" placeholder="https://..." />
    </div>
    <fieldset class="border border-gray-200 dark:border-gray-700 rounded-lg p-3">
      <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 px-2">Español</legend>
      <input pInputText [(ngModel)]="formNameEs" class="w-full" placeholder="Nombre en español" />
    </fieldset>
    <fieldset class="border border-gray-200 dark:border-gray-700 rounded-lg p-3">
      <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 px-2">English</legend>
      <input pInputText [(ngModel)]="formNameEn" class="w-full" placeholder="Name in English" />
    </fieldset>
    <fieldset class="border border-gray-200 dark:border-gray-700 rounded-lg p-3">
      <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 px-2">Svenska</legend>
      <input pInputText [(ngModel)]="formNameSv" class="w-full" placeholder="Namn på svenska" />
    </fieldset>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" [outlined]="true" (click)="closeDialog()"></p-button>
      <p-button label="Guardar" severity="primary" (click)="saveCategory()" [loading]="saving()"></p-button>
    </div>
  </ng-template>
</p-dialog>
