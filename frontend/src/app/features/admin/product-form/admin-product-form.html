<div class="max-w-4xl mx-auto">
  <!-- Header -->
  <header class="flex items-center gap-3 mb-6">
    <button pButton
            [rounded]="true"
            [text]="true"
            severity="secondary"
            icon="pi pi-arrow-left"
            (onClick)="onCancel()"
            class="hover:!bg-emerald-50 dark:hover:!bg-gray-800"></button>
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">{{ pageTitle | translate }}</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ isEditing ? 'Editando producto' : 'Nuevo producto en La Tiendita' }}</p>
    </div>
  </header>

  <p-progressBar *ngIf="loading()" mode="indeterminate" styleClass="mb-6 rounded-full"></p-progressBar>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" data-testid="product-form">

    <!-- ════════════════════════════════════ -->
    <!-- Sub-components: extracted sections  -->
    <!-- ════════════════════════════════════ -->

    <app-product-basic-info
      [formGroup]="form"
      [categories]="categories()"
      [isEditing]="isEditing">
    </app-product-basic-info>

    <app-product-translations
      [translations]="translations"
      [langs]="['es','en','sv']">
    </app-product-translations>

    <app-product-variants
      [variants]="variants()"
      (variantsChanged)="onVariantsChanged($event)">
    </app-product-variants>

    <app-image-upload
      [imageFiles]="imageFiles()"
      [existingUrls]="existingUrls()"
      [submitting]="submitting()"
      (filesChanged)="onFilesChanged($event)">
    </app-image-upload>

    <!-- ════════════════════════════════════ -->
    <!-- Form errors                         -->
    <!-- ════════════════════════════════════ -->
    <div *ngIf="form.hasError('esNameRequired') && form.touched"
         class="mb-6 px-4 py-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm rounded-xl flex items-center gap-2">
      <i class="pi pi-exclamation-circle"></i>
      El nombre en español es obligatorio
    </div>

    <!-- ════════════════════════════════════ -->
    <!-- Actions                              -->
    <!-- ════════════════════════════════════ -->
    <div class="flex items-center gap-3 pb-8">
      <button pButton type="submit"
              [disabled]="submitting()"
              [loading]="submitting()"
              icon="pi pi-check"
              label="Guardar Producto"
              severity="primary"
              data-testid="btn-save"></button>
      <button pButton type="button"
              [outlined]="true"
              severity="secondary"
              label="Cancelar"
              (onClick)="onCancel()"
              data-testid="btn-cancel"></button>
    </div>

  </form>

  <p-toast position="bottom-right"></p-toast>
</div>
