<section *ngIf="visible()" class="py-12 bg-gray-50 dark:bg-gray-900/50">
  <div class="container mx-auto px-4 sm:px-8">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">
      Vistos recientemente
    </h2>

    <div class="flex gap-4 overflow-x-auto pb-4 -mx-1 px-1 scrollbar-thin">
      <a
        *ngFor="let product of products()"
        [routerLink]="['/productos', product.slug]"
        class="flex-shrink-0 w-44 bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden group"
      >
        <div class="h-36 bg-gray-100 dark:bg-gray-700 flex items-center justify-center overflow-hidden">
          <img
            *ngIf="product.image_url"
            [src]="product.image_url"
            [alt]="product.name"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
          />
          <svg *ngIf="!product.image_url" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div class="p-3">
          <p class="text-sm font-medium text-gray-900 dark:text-white truncate">
            {{ product.name }}
          </p>
          <p class="text-sm font-semibold text-emerald-600 dark:text-emerald-400 mt-1">
            {{ product.price | currency }}
          </p>
        </div>
      </a>
    </div>
  </div>
</section>
