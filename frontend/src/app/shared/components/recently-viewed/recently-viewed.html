<section *ngIf="visible()" class="td-recent-section">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">{{ 'home.forYou' | translate }}</span>
        <h2 class="display">{{ 'home.recentlyViewed' | translate }}</h2>
      </div>
    </div>

    <div class="td-recent">
      <a
        *ngFor="let product of products()"
        [routerLink]="['/productos', product.slug]"
        class="td-recent-card"
      >
        <div class="td-recent-media">
          <img
            *ngIf="product.image_url"
            [src]="product.image_url"
            [alt]="product.name"
            loading="lazy"
          />
          <svg *ngIf="!product.image_url" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <p class="td-recent-name">{{ product.name }}</p>
        <p class="td-recent-price">{{ product.price | currency }}</p>
      </a>
    </div>
  </div>
</section>
