<div *ngIf="visible()" class="td-cookie">
  <div class="td-cookie-inner">
    <div class="td-cookie-text">
      <p>
        <i class="pi pi-shield td-cookie-icon"></i> {{ 'cookie.text' | translate }}
        <a routerLink="/privacidad" class="td-cookie-link">{{ 'cookie.moreInfo' | translate }}</a>.
      </p>
    </div>
    <div class="td-cookie-actions">
      <p-button [label]="'cookie.essential' | translate" severity="secondary" [outlined]="true" styleClass="td-cookie-btn" (click)="acceptEssential()"></p-button>
      <p-button [label]="'cookie.customize' | translate" severity="secondary" styleClass="td-cookie-btn" (click)="openPreferences()"></p-button>
      <p-button [label]="'cookie.acceptAll' | translate" severity="primary" styleClass="td-cookie-accept" (click)="acceptAll()"></p-button>
    </div>
  </div>
</div>

<!-- Preferences modal -->
<p-dialog
  [(visible)]="showModal"
  [header]="'cookie.preferencesTitle' | translate"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <div class="space-y-4">
    <!-- Essential (always on) -->
    <div class="td-cookie-opt">
      <p-checkbox [ngModel]="true" [disabled]="true" binary="true" inputId="essential" />
      <div class="flex-1">
        <label class="td-cookie-opt-label cursor-not-allowed">{{ 'cookie.essential' | translate }}</label>
        <p class="td-cookie-opt-desc">{{ 'cookie.essentialDesc' | translate }}</p>
      </div>
    </div>

    <!-- Functional -->
    <div class="td-cookie-opt">
      <p-checkbox [(ngModel)]="functional" binary="true" inputId="functional" />
      <div class="flex-1">
        <label for="functional" class="td-cookie-opt-label cursor-pointer">{{ 'cookie.functional' | translate }}</label>
        <p class="td-cookie-opt-desc">{{ 'cookie.functionalDesc' | translate }}</p>
      </div>
    </div>

    <!-- Analytics / Marketing -->
    <div class="td-cookie-opt">
      <p-checkbox [(ngModel)]="analytics" binary="true" inputId="analytics" />
      <div class="flex-1">
        <label for="analytics" class="td-cookie-opt-label cursor-pointer">{{ 'cookie.analytics' | translate }}</label>
        <p class="td-cookie-opt-desc">{{ 'cookie.analyticsDesc' | translate }}</p>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-between gap-2">
      <p-button [label]="'cookie.essentialOnly' | translate" severity="secondary" [outlined]="true" styleClass="td-cookie-btn" (click)="acceptEssential()"></p-button>
      <div class="flex gap-2">
        <p-button [label]="'common.cancel' | translate" severity="secondary" styleClass="td-cookie-btn" (click)="cancelPreferences()"></p-button>
        <p-button [label]="'cookie.save' | translate" severity="primary" styleClass="td-cookie-accept" (click)="savePreferences()"></p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>
