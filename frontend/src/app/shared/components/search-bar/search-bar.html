<div class="search-bar flex items-center gap-2 w-full max-w-md">
  <p-iconField class="w-full">
    <p-inputIcon styleClass="pi pi-search text-gray-400" />
    <input
      pInputText
      type="text"
      [placeholder]="'catalog.search' | translate"
      (input)="onInput($any($event.target).value)"
    />
  </p-iconField>
</div>
