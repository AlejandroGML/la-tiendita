<ng-container [ngSwitch]="variant">
  <span
    *ngSwitchCase="'badge'"
    class="td-chip-pos"
    [class]="badgeClasses"
  >
    {{ 'condition.' + condition | translate }}
  </span>
  <span
    *ngSwitchDefault
    [class]="chipClasses"
  >
    {{ 'condition.' + condition | translate }}
  </span>
</ng-container>
