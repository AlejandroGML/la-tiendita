<p-card styleClass="product-card w-full cursor-pointer hover:shadow-lg transition-shadow block">
  <ng-template pTemplate="header">
    <img
      [src]="imageUrl"
      [alt]="displayName"
      class="h-48 w-full object-cover"
      loading="lazy"
    />
  </ng-template>
  <ng-template pTemplate="content">
    <div class="p-3">
      <h3 class="text-sm font-semibold line-clamp-2 mb-1">{{ displayName }}</h3>
      <p class="text-lg font-bold text-gray-900 mb-2">
        {{ product.price | currency }}
      </p>
      <div class="flex flex-wrap gap-1 items-center">
        <!-- Condition badge -->
        <span
          *ngIf="product.condition"
          class="inline-block px-2 py-0.5 text-xs font-medium rounded border"
          [class]="conditionClasses"
        >
          {{ 'condition.' + conditionLabel | translate }}
        </span>
        <!-- Condition rating stars -->
        <span
          *ngIf="product.condition_rating"
          class="text-xs text-yellow-600"
          [title]="'Rating: ' + product.condition_rating + '/5'"
        >
          {{ '★'.repeat(product.condition_rating) }}{{ '☆'.repeat(5 - product.condition_rating) }}
        </span>
        <!-- Material chip -->
        <span
          *ngIf="product.material"
          class="inline-block px-2 py-0.5 text-xs bg-gray-100 text-gray-600 rounded"
        >
          {{ product.material }}
        </span>
      </div>
    </div>
  </ng-template>
</p-card>
