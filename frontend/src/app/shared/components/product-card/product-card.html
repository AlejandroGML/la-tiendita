<p-card styleClass="product-card-enhanced block w-full cursor-pointer group">
  <ng-template pTemplate="header">
    <div class="relative overflow-hidden aspect-[3/4] bg-gray-100">
      <img
        [src]="imageUrl"
        [alt]="displayName"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
        loading="lazy"
      />
      <!-- Condition badge -->
      <span
        *ngIf="product.condition"
        class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-bold shadow-sm"
        [class]="conditionBadgeClass"
      >
        {{ 'condition.' + conditionLabel | translate }}
      </span>
      <!-- Stock badge -->
      <span
        *ngIf="product.stock === 0"
        class="absolute inset-0 bg-black/50 flex items-center justify-center"
      >
        <span class="bg-white text-gray-800 px-4 py-2 rounded-full text-sm font-bold">
          {{ 'product.outOfStock' | translate }}
        </span>
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="content">
    <div class="p-0 space-y-2">
      <h3 class="text-sm font-bold text-gray-900 line-clamp-2 leading-snug group-hover:text-[var(--color-primary)] transition-colors">
        {{ displayName }}
      </h3>

      <!-- Condition rating stars -->
      <div *ngIf="product.condition_rating" class="flex items-center gap-1">
        <span class="text-yellow-500 text-xs">
          {{ '★'.repeat(product.condition_rating) }}{{ '☆'.repeat(5 - product.condition_rating) }}
        </span>
      </div>

      <div class="flex items-end justify-between gap-2">
        <div>
          <p class="text-lg font-extrabold text-gray-900">
            {{ product.price | currency }}
          </p>
          <p *ngIf="product.material" class="text-xs text-gray-500 mt-0.5 line-clamp-1">
            {{ product.material }}
          </p>
        </div>
        <span *ngIf="product.brand" class="text-xs text-gray-400 font-medium">
          {{ product.brand }}
        </span>
      </div>
    </div>
  </ng-template>
</p-card>
